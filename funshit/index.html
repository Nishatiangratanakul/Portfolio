<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fun shit · Nisha Tiangratanakul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/funshit.css">
    <script src="../js/site.js" defer></script>
    <script src="../js/confetti.js" defer></script>
    <script src="../js/funshit.js" defer></script>
</head>
<body>
    <main class="funshit">
        <!-- desktop: panel + grid -->
        <div class="layout">
            <aside class="panel"></aside>
            <div class="grid"></div>
        </div>
        <!-- phones: one at a time -->
        <div class="carousel cover">
            <div class="cinfo"></div>
            <div class="cstage"><img alt=""></div>
            <div class="cnav"><button data-step="-1" aria-label="previous">&lt;</button><span class="count"></span><button class="prompt">tap to look through</button><button data-step="1" aria-label="next">&gt;</button></div>
        </div>
    </main>
    <div class="viewer" role="dialog" aria-modal="true" hidden>
        <button class="back">back</button>
        <div class="stage"><img alt=""></div>
        <div class="nav"><button data-step="-1" aria-label="previous">&lt;</button><span class="count"></span><button data-step="1" aria-label="next">&gt;</button></div>
    </div>
</body>
</html>
